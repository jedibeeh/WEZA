<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>WEZA — Insights</title>
<style>
:root {
  --bg:#141414;--surface:#1E1E1E;--surface2:#282828;--surface3:#323232;
  --text:#F0EDE6;--muted:#888;--dim:#444;
  --sage:#7A9E8A;--amber:#C8975A;
  --a-soft:rgba(200,151,90,.12);--a-border:rgba(200,151,90,.28);
  --red:#E05252;--radius:14px;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
#page{display:flex;flex-direction:column;height:100vh;height:-webkit-fill-available}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
nav{display:flex;justify-content:space-around;background:rgba(20,20,20,.96);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,.07);
  padding:10px 0 max(14px,env(safe-area-inset-bottom));flex-shrink:0}
nav a{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10px;font-family:var(--sans);cursor:pointer;
  text-decoration:none;transition:color .18s;padding:4px 20px}
nav a.active{color:var(--amber)}
nav a svg{width:22px;height:22px;stroke-width:1.6}
.wrap{max-width:560px;margin:0 auto;padding:32px 20px 40px}
h1{font-family:var(--serif);font-size:26px;font-weight:normal;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:28px 0 10px}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid rgba(255,255,255,.05);padding:16px 18px;margin-bottom:12px}
.gate{max-width:400px;margin:80px auto;padding:0 20px;text-align:center}
.gate p{color:var(--muted);font-size:14px;margin-top:8px}
a.link{color:var(--amber);text-decoration:none}
.stat-row{display:flex;gap:12px}
.stat-box{flex:1;background:var(--surface);border-radius:var(--radius);border:1px solid rgba(255,255,255,.05);padding:16px 18px;text-align:center}
.stat-box .num{font-family:var(--serif);font-size:28px}
.stat-box .lbl{font-size:11px;color:var(--muted);margin-top:2px}
.rank-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
.rank-row:last-child{border-bottom:none}
.rank-name{flex:1;padding-right:12px}
.rank-count{color:var(--amber);font-weight:600;font-size:13px;flex-shrink:0}
.activity-row{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.activity-row:last-child{border-bottom:none}
.activity-who{font-weight:600}
.activity-meta{color:var(--muted);font-size:12px;margin-top:2px}
.empty{font-size:13px;color:var(--muted)}
</style>
</head>
<body>

<div id="page">
<div id="scroll">
<div id="gate" class="gate" style="display:none">
  <h1 style="font-family:var(--serif);font-size:22px;font-weight:normal">Not available</h1>
  <p>This page is only available to the practitioner account.</p>
  <p><a class="link" href="/">Return to WEZA</a></p>
</div>

<div id="main" class="wrap" style="display:none">
  <h1>Insights</h1>
  <div class="sub">Who's listening, and to what.</div>

  <div class="stat-row">
    <div class="stat-box"><div class="num" id="stat-plays">–</div><div class="lbl">Total plays</div></div>
    <div class="stat-box"><div class="num" id="stat-listeners">–</div><div class="lbl">Unique listeners</div></div>
  </div>

  <div class="section-label">Most popular patterns</div>
  <div class="card" id="patterns-card"><div class="empty">Loading…</div></div>

  <div class="section-label">Most active users</div>
  <div class="card" id="users-card"><div class="empty">Loading…</div></div>

  <div class="section-label">Recent activity</div>
  <div class="card" id="activity-card"><div class="empty">Loading…</div></div>
</div>
</div>

<nav id="page-nav" style="display:none">
  <a href="/#home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>Home
  </a>
  <a href="/#library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Library
  </a>
  <a href="/create.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Create
  </a>
  <a href="/insights.html" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>Insights
  </a>
  <a href="/#settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings
  </a>
</nav>
</div>

<script>
const token = localStorage.getItem('weza_token');
const role = localStorage.getItem('weza_role');

if (!token || role !== 'practitioner') {
  document.getElementById('gate').style.display = 'block';
} else {
  document.getElementById('main').style.display = 'block';
  document.getElementById('page-nav').style.display = 'flex';
  loadInsights();
}

function timeAgo(iso){
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24); return d + 'd ago';
}

async function loadInsights(){
  try{
    const res = await fetch('/api/playback', { headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load');

    document.getElementById('stat-plays').textContent = data.totals.total_plays;
    document.getElementById('stat-listeners').textContent = data.totals.unique_listeners;

    const patternsCard = document.getElementById('patterns-card');
    patternsCard.innerHTML = data.topPatterns.length
      ? data.topPatterns.map(p => `
          <div class="rank-row">
            <div class="rank-name">${p.pattern_name}</div>
            <div class="rank-count">${p.play_count} play${p.play_count!==1?'s':''}</div>
          </div>`).join('')
      : '<div class="empty">No plays logged yet.</div>';

    const usersCard = document.getElementById('users-card');
    usersCard.innerHTML = data.topUsers.length
      ? data.topUsers.map(u => `
          <div class="rank-row">
            <div class="rank-name">${u.name || u.email || 'Unknown user'}</div>
            <div class="rank-count">${u.play_count} play${u.play_count!==1?'s':''}</div>
          </div>`).join('')
      : '<div class="empty">No plays logged yet.</div>';

    const activityCard = document.getElementById('activity-card');
    activityCard.innerHTML = data.recent.length
      ? data.recent.map(r => `
          <div class="activity-row">
            <div class="activity-who">${r.name || r.email || 'Unknown user'}</div>
            <div class="activity-meta">${r.pattern_name} · ${timeAgo(r.played_at)}</div>
          </div>`).join('')
      : '<div class="empty">No activity yet.</div>';

  }catch(e){
    console.error('Failed to load insights', e);
    document.getElementById('patterns-card').innerHTML = '<div class="empty">Could not load data.</div>';
    document.getElementById('users-card').innerHTML = '';
    document.getElementById('activity-card').innerHTML = '';
  }
}
</script>
</body>
</html>
